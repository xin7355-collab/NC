// 把動作捕捉（CMU，BVH）與 CC0 動畫（Mesh2Motion，GLB）轉到 Rocketbox 的 Biped 骨架；棒式、臀橋用同一套工具自製。
// 做法：每一節骨頭對齊來源的「方向」（不受兩副骨架原始姿勢、骨頭軸向不同影響）→ 兩節骨頭 IK 把著地的腳／手固定（不滑）→ 每一格讓身體最低點剛好在地板（不浮空、不穿地）。

import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ---------- 目標骨架（Rocketbox Bip01） ----------

const T = (t, n) => t.B[n ? 'Bip01_' + n : 'Bip01'];   // '' ＝ 根骨頭 Bip01

// ---------- 來源：關節名稱對照 ----------
const MAPS = {

  m2m: { hips: 'pelvis', spine: 'spine_02', chest: 'spine_03', neck: 'neck_01', head: 'head', side: s => ({ hip: `thigh_${s}`, knee: `calf_${s}`, ankle: `foot_${s}`, toe: `ball_${s}`, clav: `clavicle_${s}`, sho: `upperarm_${s}`, elb: `lowerarm_${s}`, wri: `hand_${s}`, hand: `middle_01_${s}` }), L: 'l', R: 'r' }

// ---------- 方向對齊：把來源的一格姿勢套到目標 ----------
// rot：把來源轉到「起始時面向 +Z、左邊 +X」的偏航；off、k：位置的平移與縮放

// ---------- 烘焙：每格記錄所有身體骨頭的區域旋轉＋根骨位置 ----------

// ---------- 動作捕捉／CC0 動畫 → 目標 ----------
async function retarget(t, spec) {
