# GitHub Pages 從 gh-pages 分支發布；main 一更新就把同一版同步過去（約 1 分鐘後網站更新）
# 同步前把 index.html 的 APP_VER='dev' 換成 commit 編號，App 回到前景時用它判斷要不要自動重新載入
name: 同步網站到 gh-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 寫入版本號
        run: |
          VER="${GITHUB_SHA::7}"
          sed -i "s/const APP_VER='dev'/const APP_VER='${VER}'/" index.html
          grep -q "const APP_VER='${VER}'" index.html || { echo "index.html 找不到 const APP_VER='dev'，版本號沒寫進去"; exit 1; }
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qam "部署 ${VER}"
      - name: main → gh-pages
        run: git push --force origin HEAD:refs/heads/gh-pages
